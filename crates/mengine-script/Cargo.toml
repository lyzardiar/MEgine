[package]
name = "mengine-script"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MEngine JavaScript host and TS bridge"

[features]
default = ["v8-runtime"]
v8-runtime = ["dep:v8"]
quickjs-runtime = ["dep:rquickjs"]

[dependencies]
mengine-core.workspace = true
mengine-assets.workspace = true
glam.workspace = true
rquickjs = { version = "0.14", optional = true }
v8 = { version = "=152.2.0", optional = true }
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip", "raw_value"] }
thiserror.workspace = true
log.workspace = true
anyhow.workspace = true
